<!-- Modal del Buscador -->
<div
  id="modal-buscador"
  class="search-modal-overlay"
  onclick="closeSearchOuter(event)"
>
  <div class="search-modal-content">
    <button class="search-modal-close" onclick="closeSearchModal()">
      &times;
    </button>

    <div class="search-header">
      <input
        type="text"
        id="input-busqueda"
        placeholder="Buscar término (ej. reales, oro, ordenanza, macuquina)..."
        oninput="ejecutarBusqueda()"
        autocomplete="off"
      />
    </div>

    <div id="resultados-busqueda" class="search-results-list">
      <p class="search-placeholder">
        Escribe una palabra clave para buscar en todo el sitio.
      </p>
    </div>
  </div>
</div>
