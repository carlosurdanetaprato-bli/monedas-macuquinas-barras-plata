<div
  class="macuquina-modal-overlay open conversor-secundario-modal"
  id="modal-pasta-oro-7286"
>
  <div class="macuquina-modal-content">
    <button type="button" class="modal-close-btn" onclick="closeModalPesos()">
      &times;
    </button>
    <div class="modal-header">
      <h2>Cálculo de Pasta en Oro a Escudos y Pesos</h2>
      <p>Pragmática Secreta 1772-1786</p>
    </div>

    <div class="modal-body modal-body-grid">
      <div class="m-row-upper">
        <fieldset class="grupo-conversion">
          <legend>Ingrese Peso de la Pasta</legend>
          <div class="grid-inputs-clean">
            <div class="campo-row">
              <label>Marcos</label
              ><input
                type="number"
                id="m7286-marcos"
                placeholder="0"
                min="0"
                oninput="ejecutarCalculoAuto7286()"
              />
            </div>
            <div class="campo-row">
              <label>Onzas</label
              ><input
                type="number"
                id="m7286-onzas"
                placeholder="0"
                min="0"
                oninput="ejecutarCalculoAuto7286()"
              />
            </div>
            <div class="campo-row">
              <label>Ochavas</label
              ><input
                type="number"
                id="m7286-ochavas"
                placeholder="0"
                min="0"
                oninput="ejecutarCalculoAuto7286()"
              />
            </div>
            <div class="campo-row">
              <label>Tomines</label
              ><input
                type="number"
                id="m7286-tomines"
                placeholder="0"
                min="0"
                oninput="ejecutarCalculoAuto7286()"
              />
            </div>
            <div class="campo-row">
              <label>Granos</label
              ><input
                type="number"
                id="m7286-granos"
                placeholder="0"
                min="0"
                oninput="ejecutarCalculoAuto7286()"
              />
            </div>
          </div>
          <div id="m7286-alerta-peso" class="error-container"></div>
        </fieldset>

        <div style="display: flex; flex-direction: column; gap: 10px">
          <fieldset class="grupo-conversion">
            <legend>Ingrese Fineza de la Pasta</legend>
            <div class="grid-inputs-clean">
              <div class="campo-row">
                <label>Quilates (Máx. 24)</label
                ><input
                  type="number"
                  id="m7286-quilates"
                  placeholder="0"
                  max="24"
                  min="0"
                  oninput="ejecutarCalculoAuto7286()"
                />
              </div>
              <div class="campo-row">
                <label>Granos Ley (Máx. 3)</label
                ><input
                  type="number"
                  id="m7286-granos-ley"
                  placeholder="0"
                  max="3"
                  min="0"
                  oninput="ejecutarCalculoAuto7286()"
                />
              </div>
            </div>
            <div id="m7286-alerta-ley" class="error-container"></div>
          </fieldset>

          <div class="box-desglose">
            <p class="ref-main">Desglose de Resultados</p>
            <div style="font-size: 0.85rem; line-height: 1.5">
              <div>
                Marcos en Rieles:
                <strong id="m7286-res-rieles">0,000000</strong>
              </div>
              <div>
                Total Escudos: <strong id="m7286-res-escudos">0,000</strong>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="modal-footer-bar">
        <div class="total-highlighted-box">
          <span class="total-label">Resultado Total:</span>
          <strong id="m7286-res-final">0 Pesos, 0 Escudos</strong>
        </div>
        <div class="actions-right">
          <button
            type="button"
            class="btn-estilo-limpiar"
            onclick="limpiarConversorOro7286()"
          >
            Limpiar
          </button>
          <button
            type="button"
            class="btn-estilo-cerrar"
            onclick="closeModalPesos()"
          >
            Cerrar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
